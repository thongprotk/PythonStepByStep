# Placeholder secret — chỉ cần khi gọi /chat (dùng Anthropic API key)
# hoặc /db (dùng Supabase key).
# KHÔNG commit key thật vào file này. Cách dùng thực tế:
#   kubectl create secret generic py-app-secret \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-xxx \
#     --from-literal=SUPABASE_KEY=sb_publishable_xxx
# hoặc sửa value bên dưới rồi apply (chỉ để thực hành local).
apiVersion: v1
kind: Secret
metadata:
  name: py-app-secret
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  SUPABASE_KEY: ""
