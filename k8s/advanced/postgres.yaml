# Postgres thật chạy trong cluster (thay cho sqlite mặc định của app) — thực hành
# StatefulSet + PersistentVolumeClaim + Secret cho credentials.
#
# Sau khi apply, đổi DATABASE_URL trong configmap.yaml của app thành:
#   postgresql://py_app:py_app_password@postgres:5432/py_app
# (đổi password thật khi dùng ngoài môi trường học tập)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: py_app
  POSTGRES_PASSWORD: py_app_password
  POSTGRES_DB: py_app
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None # headless service — đúng chuẩn cho StatefulSet
